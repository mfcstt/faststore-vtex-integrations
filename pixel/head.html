<script>

function redirectToProduction(){

   const { pathname, search } = window.location
   const redirectDomain = decodeURIComponent("https://larplasticos.vtex.app/") // Replace with your domain

   if(
      pathname === '/account' ||
      pathname === '/login' ||
      pathname === '/checkout' ||
      pathname === '/checkout/orderPlaced' ||
      pathname === '/checkout/orderPlaced/' ||
      pathname === '/api/io/account' ||
      pathname === '/api/io/login' ||
      !redirectDomain) {
      return false
      }

   const redirectLink = redirectDomain + pathname + search

   window.location.href = redirectLink
}

(function() {
   redirectToProduction()

   window.addEventListener('hashchange',() => {
      redirectToProduction()
   })
})()

</script>
